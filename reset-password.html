<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ResumeIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-visual">
    <div class="auth-visual-content">
      <div class="brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M14 3v5h5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 13.5 10.3 16 16 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="brand-text"><strong>ResumeIQ</strong><span>Career Assistant</span></div>
      </div>
      <p class="auth-quote">"Choose a strong, memorable password — you'll only need to do this once."</p>
    </div>
  </aside>

  <section class="auth-form-side">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="subtitle">Your new password must be different from previous ones.</p>

      <form id="resetForm" novalidate data-success-title="Password updated" data-success-message="You can now log in with your new password.">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-icon-wrap">
            <i data-feather="lock"></i>
            <input class="input" type="password" id="newPassword" name="password" placeholder="Min. 8 characters" required minlength="8">
            <button type="button" class="input-toggle" data-toggle-password="newPassword" aria-label="Show password">
              <i data-feather="eye"></i>
            </button>
          </div>
          <p class="form-error">Minimum 8 characters.</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-icon-wrap">
            <i data-feather="lock"></i>
            <input class="input" type="password" id="confirmPassword" name="confirm" placeholder="Re-enter new password" required data-match-field="password">
          </div>
          <p class="form-error">Passwords don't match.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i data-feather="check"></i> Update Password
        </button>
      </form>

      <p class="auth-switch"><a href="login.html">&larr; Back to Log In</a></p>
    </div>
  </section>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    feather.replace();
    initFormValidation("resetForm");
    document.querySelectorAll("[data-toggle-password]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.togglePassword);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.innerHTML = `<i data-feather="${showing ? "eye" : "eye-off"}"></i>`;
        feather.replace();
      });
    });
  });
</script>
</body>
</html>
