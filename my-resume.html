<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Resume — ResumeIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="my-resume">

<div class="app">
  <div id="sidebarSlot"></div>

  <div class="main">
    <div id="topbarSlot"></div>

    <main class="content">

      <section class="page-head">
        <div>
          <p class="eyebrow">Resume</p>
          <h1>My Resume</h1>
          <p class="subtitle">All resumes you've uploaded, with version history.</p>
        </div>
        <div class="page-head-actions">
          <a href="resume-upload.html" class="btn btn-primary"><i data-feather="upload"></i> Upload New</a>
        </div>
      </section>

      <section class="panel table-panel">
        <div class="table-toolbar">
          <div class="search" style="max-width:280px;">
            <i data-feather="search"></i>
            <input type="text" placeholder="Search your resumes…">
          </div>
          <select class="input" style="width:auto;">
            <option>All formats</option>
            <option>PDF</option>
            <option>DOCX</option>
          </select>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Resume</th>
              <th>Version</th>
              <th>Format</th>
              <th>Score</th>
              <th>Uploaded</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><i data-feather="file-text"></i> Rafiq_Backend_v3.pdf</td>
              <td>v3 (latest)</td>
              <td>PDF</td>
              <td><span class="score-pill good">78</span></td>
              <td>Aug 01, 2026</td>
              <td>
                <button class="table-icon-btn" title="View" data-toast-title="Opening preview" data-toast-icon="eye"><i data-feather="eye"></i></button>
                <button class="table-icon-btn" title="Download" data-toast-title="Download started" data-toast-icon="download"><i data-feather="download"></i></button>
                <button class="table-icon-btn" title="Replace" data-toast-title="Choose a replacement file" data-toast-icon="repeat"><i data-feather="repeat"></i></button>
                <button class="table-icon-btn danger" title="Delete" data-toast-title="Resume deleted" data-toast-icon="trash-2"><i data-feather="trash-2"></i></button>
              </td>
            </tr>
            <tr>
              <td><i data-feather="file-text"></i> Rafiq_Backend_v2.docx</td>
              <td>v2</td>
              <td>DOCX</td>
              <td><span class="score-pill mid">64</span></td>
              <td>Jul 18, 2026</td>
              <td>
                <button class="table-icon-btn" title="View" data-toast-title="Opening preview" data-toast-icon="eye"><i data-feather="eye"></i></button>
                <button class="table-icon-btn" title="Download" data-toast-title="Download started" data-toast-icon="download"><i data-feather="download"></i></button>
                <button class="table-icon-btn" title="Restore this version" data-toast-title="Version restored" data-toast-icon="rotate-ccw"><i data-feather="rotate-ccw"></i></button>
                <button class="table-icon-btn danger" title="Delete" data-toast-title="Resume deleted" data-toast-icon="trash-2"><i data-feather="trash-2"></i></button>
              </td>
            </tr>
            <tr>
              <td><i data-feather="file-text"></i> Rafiq_FullStack.pdf</td>
              <td>v1</td>
              <td>PDF</td>
              <td><span class="score-pill low">51</span></td>
              <td>Jul 02, 2026</td>
              <td>
                <button class="table-icon-btn" title="View" data-toast-title="Opening preview" data-toast-icon="eye"><i data-feather="eye"></i></button>
                <button class="table-icon-btn" title="Download" data-toast-title="Download started" data-toast-icon="download"><i data-feather="download"></i></button>
                <button class="table-icon-btn" title="Restore this version" data-toast-title="Version restored" data-toast-icon="rotate-ccw"><i data-feather="rotate-ccw"></i></button>
                <button class="table-icon-btn danger" title="Delete" data-toast-title="Resume deleted" data-toast-icon="trash-2"><i data-feather="trash-2"></i></button>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="pagination">
          <span>Showing 1–3 of 3 resumes</span>
          <div class="pagination-btns">
            <button disabled><i data-feather="chevron-left" style="width:14px;height:14px;"></i></button>
            <button class="active">1</button>
            <button disabled><i data-feather="chevron-right" style="width:14px;height:14px;"></i></button>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
